name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Build and sign Tindomiel
        run: npm run tauri:build

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            shell/target/release/bundle/macos/Tindomiel.app \
            Tindomiel-macos-arm64.zip
          shasum -a 256 Tindomiel-macos-arm64.zip > Tindomiel-macos-arm64.zip.sha256

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Tindomiel-macos-arm64
          path: |
            Tindomiel-macos-arm64.zip
            Tindomiel-macos-arm64.zip.sha256
          retention-days: 14
          if-no-files-found: error
